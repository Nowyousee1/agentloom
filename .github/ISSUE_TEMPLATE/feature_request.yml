name: Feature request
description: Propose a capability, a harness adapter, or a change in behavior.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        agentloom is deliberately small: one source of truth, no runtime dependencies, no network.
        Proposals that keep it that way are much easier to accept.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Include the command or tool shape if you have one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Config changes, existing commands, or external tools that could already cover this.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Skills (render / variants / import)
        - Memory (index / injection / search)
        - MCP bridge
        - Codex adapter
        - DeepSeek Harness plugin
        - Another harness adapter
        - CLI ergonomics
        - Docs / examples
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this should respect
      options:
        - label: No new runtime dependencies
          required: true
        - label: No network calls
          required: true
        - label: Never destroys user data without a backup
          required: true
