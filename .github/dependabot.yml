version: 2
updates:
  # The workspaces are dependency-free today; this keeps them that way by surfacing any
  # devDependencies that creep in, plus the actions used by the workflows.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Major action bumps change the Node runtime the action ships with; keep them
      # out of the weekly noise and raise them deliberately instead.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
